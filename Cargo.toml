[package]
name = "zquery"
version = "0.1.0"
edition = "2024"
description = "CLI tool for browsing a Zotero library, designed for coding agent integration"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comfy-table = "7"
anyhow = "1"
dirs = "6"
