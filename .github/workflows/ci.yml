name: CI

on:
  push:
    branches: [main]
    paths: ["src/**", "Cargo.toml", "Cargo.lock"]
  pull_request:
    paths: ["src/**", "Cargo.toml", "Cargo.lock"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo build
